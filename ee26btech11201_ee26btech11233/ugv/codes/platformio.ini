[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    https://github.com/STEMpedia/DabbleESP32.git#5b630a8

; Dabble compiles unused modules that warn on missing return paths.
build_unflags =
    -Werror=return-type

; This build uses Dabble instead of the repository's custom BLE receiver.
build_src_filter =
    +<main.cpp>
    +<motor.cpp>
